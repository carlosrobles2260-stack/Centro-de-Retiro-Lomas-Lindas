server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirige las llamadas al API hacia el servicio del backend.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Página pública de la credencial del visitante (servida por el backend).
  location /credencial/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Estado de cuenta del propietario (enlace privado, servido por el backend).
  location /cuenta/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fotos de evidencia de incidentes (servidas por el backend).
  location /uploads/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # El service worker y el manifiesto no deben cachearse por el navegador,
  # así el navegador detecta siempre la versión nueva.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # index.html nunca se cachea: así el navegador carga el bundle más reciente
  # apenas se actualiza el servidor (evita tener que hacer Ctrl+F5).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta devuelve index.html (que no se cachea, ver arriba).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
