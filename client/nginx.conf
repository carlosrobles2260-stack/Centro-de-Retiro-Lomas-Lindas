server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirige las llamadas al API hacia el servicio del backend.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Página pública de la credencial del visitante (servida por el backend).
  location /credencial/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # El service worker no debe cachearse por el navegador.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
